name: Minutnik
options:
  bundleIdPrefix: com.md4ps
  deploymentTarget:
    iOS: "17.0"
  preGenCommand: bin/ryciny-do-apki
configFiles:
  Debug: Minutnik.xcconfig
  Release: Minutnik.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Minutnik:
    type: application
    platform: iOS
    sources: [Minutnik]
    info:
      path: Minutnik/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MinutnikGitCommit: $(MINUTNIK_GIT_COMMIT)
        UIBackgroundModes: [audio]
    postCompileScripts:
      - name: Zestawy
        script: bin/zestawy-do-apki
        basedOnDependencyAnalysis: false
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        MINUTNIK_GIT_COMMIT: dev
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.md4ps.minutnik
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Minutnik
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  MinutnikTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MinutnikTests]
    dependencies:
      - target: Minutnik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.md4ps.minutnik.tests
  MinutnikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MinutnikUITests]
    dependencies:
      - target: Minutnik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.md4ps.minutnik.uitests
schemes:
  Minutnik:
    build:
      targets:
        Minutnik: all
        MinutnikTests: [test]
    test:
      targets: [MinutnikTests]
  MinutnikE2E:
    build:
      targets:
        Minutnik: all
        MinutnikUITests: [test]
    test:
      targets: [MinutnikUITests]
